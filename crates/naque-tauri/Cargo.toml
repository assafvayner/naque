[package]
name = "naque-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "Tauri GUI frontend for naque — natural-language to SQL with a hard read-only safety boundary"
keywords = ["sql", "database", "ai", "agent", "gui"]
categories = ["gui", "database"]

[lib]
name = "naque_tauri"
path = "src/lib.rs"

[[bin]]
name = "naque-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
naque         = { path = "../naque" }
naque-core    = { path = "../naque-core" }
naque-db      = { path = "../naque-db" }
naque-llm     = { path = "../naque-llm" }
naque-profile = { path = "../naque-profile" }
naque-tui     = { path = "../naque-tui" }
tauri         = { workspace = true, features = [] }
serde         = { workspace = true }
serde_json    = { workspace = true }
tokio         = { workspace = true }
anyhow        = { workspace = true }
thiserror     = { workspace = true }
clap          = { workspace = true }